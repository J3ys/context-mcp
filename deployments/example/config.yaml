# ContextMCP Configuration for Example Project
# Full configuration matching the original parse scripts

vectordb:
  provider: pinecone
  indexName: example-project-mcp
  pinecone:
    cloud: aws
    region: us-east-1

embeddings:
  provider: openai
  model: text-embedding-3-large
  dimensions: 3072

# =============================================================================
# REUSABLE SKIP PATTERNS (YAML Anchors)
# =============================================================================
# Define common skip patterns that can be reused with <<: *anchorName

x-sdk-skip-dirs: &sdkSkipDirs
  - .git
  - .github
  - node_modules
  - vendor
  - dist
  - build
  - coverage
  - __pycache__
  - .venv
  - venv
  # Internal/test directories
  - internal
  - test
  - tests
  - __tests__
  - spec

x-sdk-skip-files: &sdkSkipFiles
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - ISSUE_TEMPLATE.md
  - PULL_REQUEST_TEMPLATE.md
  - LICENSE.md
  - CONTRIBUTING.md
  - API.md

sources:
  # =============================================================================
  # MAIN DOCUMENTATION (MDX)
  # =============================================================================
  - name: example-docs
    displayName: 'Example Project Documentation'
    type: github
    repository: exampleco/docs
    parser: mdx
    baseUrl: https://docs.example.com
    # Skip directories that shouldn't be indexed
    skipDirs:
      - .git
      - .github
      - .cursor
      - node_modules
      - images
      - logo
      - openapi        # OpenAPI spec folder (parsed separately)
      - api-reference  # API reference pages (parsed via OpenAPI source)
      - snippets
      # Translations (non-English docs)
      - ar
      - cn
      - de
      - es
      - fr
      - hi
      - id
      - it
      - ja
      - ko
      - pt-BR
      - sv
      - vi
    skipFiles:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - styles.css

  # =============================================================================
  # OPENAPI SPECIFICATION
  # =============================================================================
  - name: example-api
    displayName: 'Example Project API Reference'
    type: github
    repository: exampleco/docs
    path: openapi
    parser: openapi
    baseUrl: https://docs.example.com/api-reference
    # Directory containing MDX files with openapi: frontmatter for URL mapping
    urlMappingDir: api-reference

  # =============================================================================
  # BILLINGSDK DOCUMENTATION (Fumadocs MDX)
  # =============================================================================
  - name: billingsdk
    displayName: 'BillingSDK Documentation'
    type: github
    repository: exampleco/billingsdk
    path: content/docs
    parser: mdx
    baseUrl: https://billingsdk.example.com/docs
    skipDirs:
      - .git
      - .github
      - node_modules

  # =============================================================================
  # MARKETING WEBSITE (curated llms-full.txt AI reference)
  # =============================================================================
  # The website publishes a hand-curated AI reference at /llms-full.txt covering
  # products, pricing, comparisons, case studies, and company info. It's served
  # as text/plain, so saveAs gives it a .md extension for the markdown parser.
  - name: example-website
    displayName: 'Example Project Website'
    type: url
    url: https://example.com/llms-full.txt
    saveAs: llms-full.md
    parser: markdown
    baseUrl: https://example.com

  # =============================================================================
  # MARKETING WEBSITE PAGES (full markdown of every page llms-full.txt links to)
  # =============================================================================
  # followLinks treats llms-full.txt as a link index: it fetches the .md version
  # of every example.com page it references and indexes the full content,
  # giving deeper per-page detail than the aggregate above with canonical
  # per-page citation URLs.
  - name: example-website-pages
    displayName: 'Example Project Website Pages'
    type: url
    url: https://example.com/llms-full.txt
    parser: markdown
    baseUrl: https://example.com
    followLinks:
      hostAllowlist:
        - example.com
      appendExtension: .md

  # =============================================================================
  # SDK REPOSITORIES (Plain Markdown)
  # =============================================================================
  - name: sdk-typescript
    displayName: 'TypeScript SDK'
    type: github
    repository: exampleco/sdk-typescript
    parser: markdown
    language: typescript
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-ruby
    displayName: 'Ruby SDK'
    type: github
    repository: exampleco/sdk-ruby
    parser: markdown
    language: ruby
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-python
    displayName: 'Python SDK'
    type: github
    repository: exampleco/sdk-python
    parser: markdown
    language: python
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-go
    displayName: 'Go SDK'
    type: github
    repository: exampleco/sdk-go
    parser: markdown
    language: go
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-java
    displayName: 'Java SDK'
    type: github
    repository: exampleco/sdk-java
    parser: markdown
    language: java
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-php
    displayName: 'PHP SDK'
    type: github
    repository: exampleco/sdk-php
    parser: markdown
    language: php
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-csharp
    displayName: 'C# SDK'
    type: github
    repository: exampleco/sdk-csharp
    parser: markdown
    language: csharp
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: sdk-kotlin
    displayName: 'Kotlin SDK'
    type: github
    repository: exampleco/sdk-kotlin
    parser: markdown
    language: kotlin
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: example-adapters
    displayName: 'Example Adapters'
    type: github
    repository: exampleco/adapters
    parser: markdown
    language: typescript
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: ingestion-blueprints
    displayName: 'Ingestion Blueprints'
    type: github
    repository: exampleco/ingestion-blueprints
    parser: markdown
    language: typescript
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: example-migrate
    displayName: 'Example Migrate CLI'
    type: github
    repository: exampleco/migrate
    parser: markdown
    language: typescript
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: example-woocommerce
    displayName: 'WooCommerce Plugin'
    type: github
    repository: exampleco/woocommerce
    parser: markdown
    language: php
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

  - name: example-figma
    displayName: 'Figma Plugin'
    type: github
    repository: exampleco/figma-plugin
    parser: markdown
    language: typescript
    skipDirs: *sdkSkipDirs
    skipFiles: *sdkSkipFiles

reindex:
  clearBeforeReindex: true
  batchSize: 100
